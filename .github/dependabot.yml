# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
 - package-ecosystem: "devcontainers"
   directory: "/"
   schedule:
     interval: weekly
 # Keep workflow action versions current. A pinned action that nobody bumps
 # eventually breaks or is retired, and the failure is easy to miss.
 - package-ecosystem: "github-actions"
   directory: "/"
   schedule:
     interval: weekly
 # Watch container base images so base-image CVEs get flagged/patched:
 # docker/app/Dockerfile (tomcat) and docker/db/Dockerfile (postgres + PostGIS)
 - package-ecosystem: "docker"
   directories:
     - "/docker/app"
     - "/docker/db"
   schedule:
     interval: weekly
   ignore:
     # Tomcat 10+ moves the servlet API from javax.* to jakarta.* (breaking);
     # hold major base-image bumps until the Jakarta EE migration is done.
     - dependency-name: "tomcat"
       update-types: ["version-update:semver-major"]
